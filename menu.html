<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MENU AIM - Bi Enter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  font-family: 'Poppins', sans-serif;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #121212;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.app-container {
  width: 100%;
  max-width: 400px;
  background: #1f1f1f;
  border-radius: 20px;
  padding: 20px;
}

h2 {
  text-align: center;
  color: #00ffd5;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #ccc;
  margin-bottom: 15px;
}

.toggle-group {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #292929;
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
}

/* SWITCH */
.switch {
  position: relative;
  width: 50px;
  height: 25px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 25px;
}

.slider:before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 4px;
  bottom: 3.5px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider {
  background: #00ffd5;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

/* DPI */
.dpi-container {
  margin-top: 20px;
  text-align: center;
}

.dpi-container input {
  width: 100%;
}

/* CONSOLE */
.console {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.console-box {
  width: 90%;
  max-width: 400px;
  background: #000;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 20px #00ffd5;
}

.console-text {
  color: #00ffd5;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="app-container">
  <h2>HeadLock V2 OB53</h2>
  <div class="subtitle">Bao Nguyen</div>

  <!-- MENU -->
  <div class="toggle-group"><span>AIMLOCK VIP</span><label class="switch"><input type="checkbox" onchange="toggleInfo('aimlock', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>AIMHEAD</span><label class="switch"><input type="checkbox" onchange="toggleInfo('aimhead', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>AIMBOT</span><label class="switch"><input type="checkbox" onchange="toggleInfo('aimbot', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>SENSITIVITY</span><label class="switch"><input type="checkbox" onchange="toggleInfo('sensitivity', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>FIX LAG</span><label class="switch"><input type="checkbox" onchange="toggleInfo('fixlag', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>FIX RUNG</span><label class="switch"><input type="checkbox" onchange="toggleInfo('fixrung', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>HEADLOCK VIP</span><label class="switch"><input type="checkbox" onchange="toggleInfo('headlock', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>TỐI ƯU MÁY</span><label class="switch"><input type="checkbox" onchange="toggleInfo('toiuu', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>Fix Game Free Fire</span><label class="switch"><input type="checkbox" onchange="toggleInfo('fix1', this.checked)"><span class="slider"></span></label></div>
  <div class="toggle-group"><span>Fix Game Free Fire Max</span><label class="switch"><input type="checkbox" onchange="toggleInfo('fix2', this.checked)"><span class="slider"></span></label></div>

  <!-- DPI -->
  <div class="dpi-container">
    🎯 DPI: <span id="dpi-value">275</span>
    <input type="range" min="0" max="550" value="275" oninput="updateDPI(this.value)">
  </div>
</div>

<!-- CONSOLE -->
<div id="console" class="console">
  <div class="console-box">
    <div id="consoleText" class="console-text"></div>
  </div>
</div>

<script>
const infoMap = {
  aimlock:"AIMLOCK VIP",
  aimhead:"AIMHEAD",
  aimbot:"AIMBOT",
  sensitivity:"SENSITIVITY",
  fixlag:"FIX LAG",
  fixrung:"FIX RUNG",
  headlock:"HEADLOCK VIP",
  toiuu:"TỐI ƯU MÁY",
  fix1:"Fix Game Free Fire",
  fix2:"Fix Game Free Fire Max"
};

let running = false;

function toggleInfo(key, checked){
  if(running) return;
  running = true;

  const consoleBox = document.getElementById("console");
  const textBox = document.getElementById("consoleText");

  consoleBox.style.display = "flex";
  textBox.innerHTML = "";

  let lines = checked ? [
    "⚙️ Initializing...",
    "🔍 Scanning...",
    "💉 Injecting " + infoMap[key] + "...",
    "⚡ Optimizing...",
    "✅ " + infoMap[key] + " thành công"
  ] : [
    "⛔ Stopping " + infoMap[key] + "...",
    "🧹 Cleaning...",
    "❌ Đã tắt " + infoMap[key]
  ];

  let i = 0;

  function run(){
    if(i < lines.length){
      textBox.innerHTML += lines[i] + "<br>";
      i++;
      setTimeout(run, 300);
    } else {
      setTimeout(()=>{
        consoleBox.style.display = "none";
        running = false;
      },800);
    }
  }

  run();
}

function updateDPI(val){
  document.getElementById("dpi-value").innerText = val;
}
</script>

</body>
</html>
