<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HeadLock V1</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(180deg,#2b2b2b,#0f0f0f);
  color:#fff;
}

/* FIX ZOOM */
input{font-size:16px;}

/* HEADLOCK */
.headlock{
  position:fixed;
  top:10px;
  left:0;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  z-index:9999;
  color:#fff;
  text-shadow:0 0 10px red,0 0 20px red;
  animation:blink 3s infinite;
}

@keyframes blink{
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}

/* AVATAR */
.corner-img{
  position:fixed;
  top:10px;
  left:10px;
  width:40px;
  height:40px;
  border-radius:50%;
  z-index:10000;
  box-shadow:0 0 10px red;
}

/* MAIN */
.screen{
  max-width:600px;
  margin:auto;
  padding:20px;
  margin-top:90px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  background:#111;
  color:#fff;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#888,#555);
  color:#fff;
}

/* CONTACT */
.contact-box{
  margin-top:20px;
  background:#1a1a1a;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

.contact-btns{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.contact-btns a{
  flex:1;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  background:#444;
  color:#fff;
}

/* GALLERY */
.uchiha-gallery{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.uchiha-gallery img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

.user-img{
  grid-column:span 2;
  height:160px;
  border:2px solid #fff;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.popup-box{
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:350px;
  text-align:center;
}

/* GIFT */
.gift{
  font-size:40px;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* MARQUEE */
.marquee{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#111;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.marquee span{
  padding-left:100%;
  animation:run 12s linear infinite;
}

@keyframes run{
  100%{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div class="headlock">HeadLock V1</div>

<img src="https://sf-static.upanhlaylink.com/img/image_20260330e84072be907c21ceb868972c94a9d7ec.jpg" class="corner-img">

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <div class="gift">🎁</div>
    <h3>FREE KEY VIP</h3>

    <p style="text-align:left">
1. Sao chép link<br>
2. Vượt link<br>
3. Lấy key cuối trang
    </p>

    <input id="link" value="https://link4m.net/5FcieDl" readonly>
<button onclick="copyLink()">Sao chép link</button>
<button onclick="closePopup()">Đóng ngay</button>
  </div>
</div>

<div class="screen">

  <!-- LOGIN -->
  <div class="card">
    <h3>Đăng nhập key</h3>
    <input id="key" placeholder="Nhập key...">
    <button onclick="login()">Đăng nhập</button>
    <p id="status"></p>
  </div>

  <!-- CONTACT -->
  <div class="contact-box">
    <h4>Liên hệ</h4>
    <div class="contact-btns">
      <a href="https://zalo.me/0877660792" target="_blank">Zalo</a>
      <a href="https://www.facebook.com/share/1BZKgdgkB6/?mibextid=wwXIfr" target="_blank">Facebook</a>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="uchiha-gallery">
    <img src="https://sf-static.upanhlaylink.com/img/image_20260330cce11275b7f15c018d7b96409b8179fb.jpg">
    <img src="https://sf-static.upanhlaylink.com/img/image_202603308b8624cd83fabd71aa501b09036e9113.jpg">
    <img src="https://sf-static.upanhlaylink.com/img/image_20260330a3758c387bb3f384f69754c7958599f5.jpg">
    <img src="https://sf-static.upanhlaylink.com/img/image_20260330b0d6e271441a65aa9b55d916219c71f7.jpg">
    <img src="https://sf-static.upanhlaylink.com/img/image_202603306032fc007b31c0b19cce1822adf5e002.jpg" class="user-img">
  </div>

</div>

<div class="marquee">

</div>

<script src="keys.js"></script>
<script>
function copyLink(){
  var input = document.getElementById("link");
  input.select();
  input.setSelectionRange(0,99999); // cho mobile
  document.execCommand("copy");
  alert("Đã copy link!");
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function login(){
  var key = document.getElementById("key").value.trim();
  var status = document.getElementById("status");

  if(!key){
    status.innerText = "Nhập key!";
    return;
  }

  if(window.HeadLockV1 && window.HeadLockV1[key]){
    status.innerText = "✅ Key hợp lệ! Đang chuyển...";
    setTimeout(()=>{
      window.location.href = "menu.html";
    },500);
  } else {
    status.innerText = "❌ Sai key!";
  }
}
</script>

  }
}
</script>

</body>
</html>
