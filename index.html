<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bấm là dính 👻</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* Trang đầu */
#home{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

button{
    padding:18px 40px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#ffcc00;
    font-weight:bold;
    cursor:pointer;
}

/* Trang hù */
#scary{
    height:100vh;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    animation:flash 0.2s infinite;
}

@keyframes flash{
    0%{background:black;}
    50%{background:#200;}
    100%{background:black;}
}

#text{
    color:white;
    font-size:40px;
    text-align:center;
    text-shadow:0 0 20px red;
    line-height:1.6;
}
</style>
</head>

<body>

<div id="home">
    <button onclick="go()">BẤM Đi 🎁</button>
</div>

<div id="scary">
    <div id="text"></div>
</div>

<audio id="sound" src="https://image2url.com/r2/default/videos/1770802137743-a2ad7b3a-e1c8-44f3-9dab-a611e1808c9e.mp4"></audio>

<script>
function go(){
    document.getElementById("home").style.display = "none";
    document.getElementById("scary").style.display = "flex";
    document.getElementById("sound").play();

    const lines = [
        "Diệp ơi...",
        "Mày là con chó nô tì 🐕",
        "Cái lồn bà mày nhớ mặt tao...",
        "Nhìn Cái Con Cặc...",
        "Mày Nói Ai Đao😈"
    ];

    let i = 0;
    const text = document.getElementById("text");

    const interval = setInterval(()=>{
        if(i < lines.length){
            text.innerHTML += lines[i] + "<br>";
            i++;
        } else {
            clearInterval(interval);
        }
    }, 1200); // thời gian xuất hiện mỗi câu
}
</script>

</body>
</html>
