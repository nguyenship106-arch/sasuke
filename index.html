<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAVEN.VN</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
}

/* MATRIX */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* LOGIN */

#loginBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:300px;
background:#141821;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 0 20px #ff7b00;
}

#loginBox h1{
color:#ff7b00;
margin-bottom:15px;
}

#loginBox input{
width:90%;
padding:10px;
border-radius:6px;
border:none;
margin-bottom:10px;
}

#loginBox button{
background:#ff7b00;
border:none;
padding:10px 20px;
color:white;
border-radius:8px;
font-size:16px;
}

.link{
display:block;
margin-top:6px;
color:#00eaff;
text-decoration:none;
}

/* MENU */

#menu{
display:none;
position:absolute;
top:120px;
left:60px;
width:260px;
background:#141821;
border-radius:12px;
color:white;
box-shadow:0 0 15px black;
}

#header{
padding:12px;
background:#ff7b00;
text-align:center;
border-radius:12px 12px 0 0;
font-weight:bold;
cursor:move;
position:relative;
}

#close{
position:absolute;
right:10px;
top:8px;
cursor:pointer;
}

.section{
padding:10px;
border-bottom:1px solid #2a2f3a;
}

.section h3{
margin:5px 0;
color:#ff7b00;
}

/* SWITCH */

.switch{
position:relative;
display:inline-block;
width:40px;
height:20px;
float:right;
}

.switch input{
display:none;
}

.slider{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:#555;
border-radius:20px;
}

.slider:before{
content:"";
position:absolute;
height:16px;
width:16px;
left:2px;
bottom:2px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked + .slider{
background:#ff7b00;
}

input:checked + .slider:before{
transform:translateX(20px);
}

input[type=range]{
width:100%;
}

/* FOV */

#fovCircle{
position:fixed;
top:50%;
left:50%;
border:2px solid red;
border-radius:50%;
transform:translate(-50%,-50%);
display:none;
pointer-events:none;
}

/* CROSSHAIR */

#crosshair{
position:fixed;
top:50%;
left:50%;
width:40px;
transform:translate(-50%,-50%);
display:none;
pointer-events:none;
}

.contactBtn{
display:block;
margin-top:6px;
background:#ff7b00;
padding:7px;
text-align:center;
border-radius:6px;
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="fovCircle"></div>

<img id="crosshair" src="https://i.postimg.cc/fTvjLqpd/IMG-2481.png">

<!-- LOGIN -->

<div id="loginBox">

<h1>LEAVEN.VN</h1>

<input id="keyInput" placeholder="Nhập KEY">

<br>

<button onclick="login()">LOGIN</button>

<a class="link" href="https://zalo.me/0877660792">ZALO ADMIN</a>
<a class="link" href="https://t.me/Bi_no01">TELEGRAM ADMIN</a>

</div>

<!-- MENU -->

<div id="menu">

<div id="header">
LEAVEN.VN
<span id="close">✕</span>
</div>

<div class="section">

<h3>AIMBOT</h3>

Aim Bot
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>

<br><br>

FOV
<label class="switch">
<input type="checkbox" id="fovToggle">
<span class="slider"></span>
</label>

<input type="range" id="fovRange" min="0" max="360" value="120">

</div>

<div class="section">

<h3>TÂM ẢO</h3>

Crosshair
<label class="switch">
<input type="checkbox" id="crossToggle">
<span class="slider"></span>
</label>

</div>

<div class="section">

<h3>LIÊN HỆ ADMIN</h3>

<a class="contactBtn" href="https://zalo.me/0877660792">ZALO</a>
<a class="contactBtn" href="https://t.me/Bi_no01">TELEGRAM</a>

</div>

</div>

<script>

/* MATRIX */

const canvas=document.getElementById("matrix")
const ctx=canvas.getContext("2d")

canvas.height=window.innerHeight
canvas.width=window.innerWidth

const letters="01LEAVEN"
const fontSize=16
const columns=canvas.width/fontSize

const drops=[]

for(let i=0;i<columns;i++){
drops[i]=1
}

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#0f0"
ctx.font=fontSize+"px monospace"

for(let i=0;i<drops.length;i++){

const text=letters[Math.floor(Math.random()*letters.length)]

ctx.fillText(text,i*fontSize,drops[i]*fontSize)

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0
}

drops[i]++

}

}

setInterval(draw,35)

/* LOGIN */

function login(){

const key=document.getElementById("keyInput").value

if(key==="LEAVENVIP"){

document.getElementById("loginBox").style.display="none"
document.getElementById("menu").style.display="block"

}else{

alert("KEY SAI")

}

}

/* MENU CLOSE */

document.getElementById("close").onclick=()=>{
menu.style.display="none"
}

/* 3 FINGER */

document.addEventListener("touchstart",e=>{

if(e.touches.length===3){

menu.style.display="block"

}

})

/* DRAG */

let startX,startY
const menu=document.getElementById("menu")
const header=document.getElementById("header")

header.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX-menu.offsetLeft
startY=e.touches[0].clientY-menu.offsetTop
})

document.addEventListener("touchmove",e=>{

if(startX===undefined)return

menu.style.left=e.touches[0].clientX-startX+"px"
menu.style.top=e.touches[0].clientY-startY+"px"

})

document.addEventListener("touchend",()=>{
startX=undefined
})

/* FOV */

const fovToggle=document.getElementById("fovToggle")
const fovRange=document.getElementById("fovRange")
const fovCircle=document.getElementById("fovCircle")

fovToggle.onchange=()=>{
fovCircle.style.display=fovToggle.checked?"block":"none"
}

fovRange.oninput=()=>{

let size=fovRange.value*2

fovCircle.style.width=size+"px"
fovCircle.style.height=size+"px"

}

/* CROSSHAIR */

const crossToggle=document.getElementById("crossToggle")
const crosshair=document.getElementById("crosshair")

crossToggle.onchange=()=>{
crosshair.style.display=crossToggle.checked?"block":"block"
}

</script>

</body>
</html>
